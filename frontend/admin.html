<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeşil İz Admin</title>
  <link rel="icon" type="image/x-icon" href="images/logo.png">
  <link rel="stylesheet" href="style_admin.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex">
</head>


<body>
  <main class="content-box">
    <article class="entry-card">
      <h2>Yeni içerik</h2>
      <form id="entry-form">
        <select id="entry-section" name="section" class="input_box" required></select>
        <input type="text" name="title" class="input_box" placeholder="Başlık" maxlength="200" required>
        <textarea name="content" class="input_box" placeholder="İçerik" rows="6" maxlength="5000" required></textarea>
        <button type="submit">Yayınla</button>
      </form>
      <p id="entry-message"></p>
    </article>

    <article class="entry-card">
      <h2>Yayındaki içerikler</h2>
      <select id="filter-section" class="input_box"></select>
      <div id="entry-list"></div>
    </article>

    <article class="entry-card">
      <h2>Gönüllü başvuruları</h2>
      <div id="volunteer-list"></div>
    </article>

    <button id="logout-btn" type="button">Çıkış yap</button>
  </main>
  <script type="module" src="src/panel.ts"></script>
</body>
